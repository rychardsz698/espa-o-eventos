# Blueprint do Render: cria o site (Node) + o banco PostgreSQL de uma vez.
databases:
  - name: meu-espaco-db
    plan: free
    databaseName: meu_espaco
    user: meu_espaco_user

services:
  - type: web
    name: meu-espaco
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: meu-espaco-db
          property: connectionString
